<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>蜜蜂信息采集 · 更新中</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Microsoft YaHei", sans-serif;
    background: #ffffff;
    color: #1f2329;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
  }
  #app { height: 100%; display: flex; align-items: stretch; }

  .art {
    flex: 0 0 244px; position: relative;
    display: flex; align-items: center; justify-content: center;
  }
  .art .halo {
    position: absolute; left: 50%; top: 50%;
    width: 340px; height: 340px; transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(circle,
      rgba(99, 189, 147, .17) 0%,
      rgba(167, 149, 222, .11) 46%,
      rgba(255, 255, 255, 0) 68%);
  }
  .art img {
    position: relative; z-index: 1; width: 196px; height: auto;
    filter: drop-shadow(0 16px 22px rgba(198, 74, 64, .18));
    animation: float 4s ease-in-out infinite;
  }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

  .pane { flex: 1 1 auto; min-width: 0; padding: 44px 44px 32px 10px; display: flex; flex-direction: column; }
  .dots { display: flex; gap: 7px; }
  .dots i { width: 9px; height: 9px; border-radius: 50%; display: block; }
  .dots .g { background: #63bd93; }
  .dots .p { background: #a795de; }
  .dots .o { background: #ecb27c; }
  h1 { font-size: 25px; font-weight: 600; letter-spacing: .6px; margin-top: 14px; }
  .sub { font-size: 13.5px; color: #8a8f99; margin-top: 7px; }

  .bar-wrap { margin-top: 26px; height: 10px; border-radius: 5px; background: #eef0f3; overflow: hidden; position: relative; }
  /* 下载态：确定进度条 */
  #bar { height: 100%; width: 6%; border-radius: 5px; background: linear-gradient(90deg, #63bd93 0%, #8fd0b0 100%); transition: width .38s ease; }
  /* 安装态：走马灯不确定进度条 */
  body.install #bar {
    position: absolute; top: 0; left: -42%; width: 42%; height: 100%;
    background: linear-gradient(90deg, rgba(99,189,147,.35) 0%, #63bd93 100%);
    border-radius: 5px; animation: slide 1.3s ease-in-out infinite;
  }
  @keyframes slide { 0% { left: -42%; } 100% { left: 100%; } }

  .bar-row { display: flex; justify-content: space-between; align-items: baseline; font-size: 12.5px; color: #8a8f99; margin-top: 9px; }
  #pct { font-size: 20px; font-weight: 600; color: #2f3a44; font-variant-numeric: tabular-nums; line-height: 1; }

  #note { margin-top: auto; padding-top: 12px; flex: 0 0 auto; font-size: 12.5px; color: #8a8f99; line-height: 1.6; }
  #note b { color: #63bd93; font-weight: 600; }
</style>
</head>
<body class="install">
  <div id="app">
    <aside class="art">
      <div class="halo"></div>
      <img src="file:///E:/WorkBuddy-Projects/wa-assistant/public/img/bee-robot.png" alt="" />
    </aside>
    <main class="pane">
      <div class="dots"><i class="g"></i><i class="p"></i><i class="o"></i></div>
      <h1 id="title">正在安装更新</h1>
      <div class="sub" id="sub">更新版本中，请稍等…</div>
      <div class="bar-wrap"><div id="bar"></div></div>
      <div class="bar-row"><span id="left">正在安装新版本到默认位置</span><span id="pct">请勿关闭软件</span></div>
      <div id="note">完成后软件会<b>自动重新打开</b>，数据都在 D 盘、登录态保留，<b>无需重新登录</b>。</div>
    </main>
  </div>

<script>
  // 由 puppeteer 注入切换：window.__setMode('download'|'install', percent)
  window.__setMode = function (mode, pct) {
    var body = document.body;
    if (mode === 'download') {
      body.classList.remove('install');
      document.getElementById('title').textContent = '正在下载更新';
      document.getElementById('sub').textContent = 'v2.7.1221 → v2.7.1231';
      document.getElementById('left').textContent = '正在下载更新包';
      document.getElementById('pct').textContent = (pct || 0) + '%';
      document.getElementById('bar').style.width = (pct || 0) + '%';
      document.getElementById('note').innerHTML = '下载完成后将<b>自动安装</b>，无需你操作。';
    } else {
      body.classList.add('install');
      document.getElementById('title').textContent = '正在安装更新';
      document.getElementById('sub').textContent = '更新版本中，请稍等…';
      document.getElementById('left').textContent = '正在安装新版本到默认位置';
      document.getElementById('pct').textContent = '请勿关闭软件';
      document.getElementById('note').innerHTML = '完成后软件会<b>自动重新打开</b>，数据都在 D 盘、登录态保留，<b>无需重新登录</b>。';
    }
  };
  window.__setMode('install');
</script>
</body>
</html>
